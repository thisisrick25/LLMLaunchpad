<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Rocket/Launch icon -->
  <g fill="white">
    <!-- Rocket body -->
    <path d="M256 80c-40 60-60 120-60 180 0 40 20 80 60 100 40-20 60-60 60-100 0-60-20-120-60-180z"/>
    <!-- Rocket fins -->
    <path d="M196 340c-20 0-40 20-50 40 20 10 40 12 54 12v-52z"/>
    <path d="M316 340c20 0 40 20 50 40-20 10-40 12-54 12v-52z"/>
    <!-- Flame -->
    <ellipse cx="256" cy="420" rx="30" ry="50" fill="#FCD34D"/>
    <ellipse cx="256" cy="410" rx="18" ry="30" fill="#F97316"/>
  </g>
  <!-- AI circuit lines -->
  <g stroke="white" stroke-width="3" fill="none" opacity="0.6">
    <path d="M120 200 L170 200 L170 250"/>
    <path d="M392 200 L342 200 L342 250"/>
    <circle cx="120" cy="200" r="6" fill="white"/>
    <circle cx="392" cy="200" r="6" fill="white"/>
  </g>
</svg>
